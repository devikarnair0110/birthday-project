{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background-image: url("{% static 'images/both.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height:100vh;

            font-family: Arial, sans-serif;
            overflow:auto;
            color:white;

        }

        .overlay{

            width:100%;
            min-height:100vh;

            background: rgba(0,0,0,0.4);

            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;

            text-align:center;
            padding:40px;

        }

        h1{

            font-size:70px;
            margin-bottom:20px;

        }

        p{

            font-size:30px;
            margin-bottom:30px;

        }

        /* Balloon */

        .balloon{

            font-size:90px;
            cursor:pointer;
            animation: float 2s infinite;

        }

        @keyframes float{

            0%{
                transform: translateY(0px);
            }

            50%{
                transform: translateY(-20px);
            }

            100%{
                transform: translateY(0px);
            }

        }

        /* Teddy */

        #teddyBox{

            display:none;
            margin-top:20px;

        }

        #teddyBox h2{

            font-size:80px;

        }

        /* Buttons */

        #buttons{

            display:none;
            margin-top:20px;

        }

        button{

            padding:15px 35px;
            border:none;
            border-radius:15px;
            font-size:22px;
            cursor:pointer;
            margin:10px;

            background:white;
            color:hotpink;

            transition:0.3s;

        }

        button:hover{

            background:hotpink;
            color:white;

        }

        /* Image Section */

        .image-box{

            display:none;
            margin-top:30px;

        }

        .image-row{

            display:flex;
            justify-content:center;
            align-items:center;
            gap:20px;

            flex-wrap:wrap;

        }

        .image-row img{

            width:250px;
            height:350px;

            object-fit:cover;

            border-radius:20px;
            border:5px solid white;

            box-shadow:0 0 20px rgba(255,255,255,0.5);

        }

        /* Memory Message */

        .message{

            margin-top:20px;

            font-size:28px;
            font-family:cursive;
            font-weight:bold;

            color:#ffd6e7;

            text-shadow:2px 2px 10px black;

        }

        /* Special Text */

        .special-text{

            margin-top:15px;

            font-size:32px;
            font-family:cursive;
            font-weight:bold;

            color:white;

            text-shadow:2px 2px 10px black;

        }

    </style>

</head>

<body>

    <div class="overlay">

        <h1>🎂 Happy Birthday 🎂</h1>

        <p>Click the cute balloon 🎈</p>

        <!-- Balloon -->

        <div class="balloon" onclick="showSurprise()">

            🎈

        </div>

        <!-- Teddy -->

        <div id="teddyBox">

            <h2>🧸</h2>

        </div>

        <!-- Buttons -->

        <div id="buttons">

            <button onclick="showPonnu()">

                ✨ Special

            </button>

            <button onclick="showMemory()">

                💖 Moments

            </button>

        </div>

        <!-- Special Section -->

        <div class="image-box" id="ponnuBox">

            <img src="{% static 'images/ponnu.jpeg' %}"
                 style="width:300px;
                 border-radius:20px;
                 border:5px solid white;">

            <div class="special-text">

                Forever Special 💕

            </div>

        </div>

        <!-- Moments Section -->

        <div class="image-box" id="memoryBox">

            <div class="image-row">

                <img src="{% static 'images/memory.jpeg' %}">

                <img src="{% static 'images/both.jpeg' %}">

            </div>

            <div class="message">

                I Love You 💖

            </div>

        </div>

    </div>

    <!-- Fireworks -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>

        function showSurprise(){

            document.getElementById("teddyBox").style.display = "block";

            document.getElementById("buttons").style.display = "block";

            // Fireworks Effect

            var duration = 5 * 1000;
            var end = Date.now() + duration;

            (function frame() {

                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });

                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }

            }());

        }

        function showPonnu(){

            document.getElementById("ponnuBox").style.display = "block";

            document.getElementById("memoryBox").style.display = "none";

        }

        function showMemory(){

            document.getElementById("memoryBox").style.display = "block";

            document.getElementById("ponnuBox").style.display = "none";

        }

    </script>

</body>

</html>
